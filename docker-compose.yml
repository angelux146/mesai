
services:

  app:
    build: .
    container_name: mesai_app

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mesai_mysql

    restart: always

    environment:
      MYSQL_DATABASE: mesai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: mesai
      MYSQL_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
